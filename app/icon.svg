<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48">
  <rect width="48" height="48" rx="11" fill="#4d3f28"/>
  <!-- faint topographic contour lines -->
  <g fill="none" stroke="#9c8a64" stroke-width="1.6" stroke-linecap="round" opacity="0.5">
    <path d="M5 31 C 13 25, 18 31, 25 25"/>
    <path d="M19 41 C 27 35, 31 41, 43 33"/>
  </g>
  <!-- the route: a switchback trail climbing the map -->
  <path d="M11 39 C 18 33, 13 26, 22 22 C 31 18, 25 12, 33 8"
        fill="none" stroke="#a8492a" stroke-width="4.4"
        stroke-linecap="round" stroke-linejoin="round"/>
  <!-- trailhead waypoint -->
  <circle cx="11" cy="39" r="3.4" fill="#efe7d3"/>
  <circle cx="11" cy="39" r="1.5" fill="#a8492a"/>
  <!-- summit waypoint — diamond, echoes the nav brand glyph -->
  <g transform="translate(33 8) rotate(45)">
    <rect x="-3.3" y="-3.3" width="6.6" height="6.6" rx="1.3" fill="#efe7d3"/>
    <rect x="-1.1" y="-1.1" width="2.2" height="2.2" fill="#a8492a"/>
  </g>
</svg>
